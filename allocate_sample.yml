---
- name: Allocate Sample z/OS Dataset
  hosts: zxplore
  gather_facts: false
  environment: "{{ environment_vars }}"
  collections:
    - ibm.ibm_zos_core
  vars:
    clean_dsname: "{{ dsname | trim | upper }}"
    clean_dsorg: "{{ dsorg | trim | upper }}"
    # Define sample content lines to insert
    sample_content:
      - "/* SAMPLE FILE CREATED BY ANSIBLE AWX */"
      - "IDENTIFICATION DIVISION."
      - "PROGRAM-ID. HELLO."
      - "PROCEDURE DIVISION."
      - "    DISPLAY 'HELLO MAINFRAME'."
      - "    GOBACK."

  tasks:
    - name: Validate dataset name syntax
      ansible.builtin.fail:
        msg: "Invalid dataset name syntax. Segments must be 1-8 chars and total length <= 44."
      # FIXED: Changed from '| match' to '| regex_search'
      when: >
        not (clean_dsname | regex_search('^[A-Z@#$][A-Z0-9@#$-]{0,7}(\\.[A-Z@#$][A-Z0-9@#$-]{0,7})*$')) 
        or (clean_dsname | length > 44)

    # FIXED: Using zos_stat to check if the dataset exists
    - name: Check if dataset already exists
      ibm.ibm_zos_core.zos_stat:
        name: "{{ clean_dsname }}"
      register: ds_stat_result

    # FIXED: zos_stat returns an 'exists' flag inside its output dictionary
    - name: Fail if dataset already exists
      ansible.builtin.fail:
        msg: "The dataset {{ clean_dsname }} already exists on the system."
      when: ds_stat_result.stat.exists

    - name: Allocate the SEQ or PDS dataset
      ibm.ibm_zos_core.zos_data_set:
        name: "{{ clean_dsname }}"
        type: "{{ clean_dsorg | lower }}"  # FIXED: Added '| lower' filter here
        state: present
        space_type: "{{ 'trk' if clean_dsorg in ['SEQ', 'PDS'] else 'trk' }}" # FIXED: Must be lowercase 'trk' or 'cyl'
        space_primary: 10
        space_secondary: 2
        record_format: fb               # FIXED: Changed from 'FB' to lowercase 'fb'
        record_length: 80
        directory_blocks: "{{ 5 if clean_dsorg == 'PDS' else omit }}"

   # FIXED: Using correct module 'zos_lineinfile' for Sequential datasets
    - name: Populate records into Sequential dataset
      ibm.ibm_zos_core.zos_lineinfile:
        src: "{{ clean_dsname }}"
        line: "{{ item }}"
        state: present
      loop: "{{ sample_content }}"
      when: clean_dsorg == 'SEQ'

    # FIXED: Using correct module 'zos_lineinfile' with dynamic member string
    - name: Create and populate member inside PDS dataset
      ibm.ibm_zos_core.zos_lineinfile:
        src: "{{ clean_dsname }}({{ clean_member }})"
        line: "{{ item }}"
        state: present
      loop: "{{ sample_content }}"
      when: clean_dsorg == 'PDS'

    - name: Output allocation success confirmation
      ansible.builtin.debug:
        msg: "Successfully created and populated {{ clean_dsorg }} dataset: {{ clean_dsname }}"
    # FIXED: Restructured dd_output and dd_input to isolate dd_name inside them
    # ALTERNATIVE METHOD: Cleaner execution mapping
    - name: Verify dataset attributes via zos_tso_command
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - LISTDS '{{ clean_dsname }}'
      register: tso_cmd_output

    - name: Display TSO LISTDS confirmation from mainframe
      ansible.builtin.debug:
        msg: "{{ tso_cmd_output.output[0].stdout_lines }}"
