---
- name: Allocate and Populate Sample z/OS Dataset
  hosts: zxplore
  gather_facts: false
  environment: "{{ environment_vars }}"
  collections:
    - ibm.ibm_zos_core
  vars:
    clean_dsname: "{{ dsname | default('') | trim | upper }}"
    clean_dsorg: "{{ dsorg | default('') | trim | upper }}"
    clean_member: "{{ member_name | default('MAIN') | trim | upper }}"
    # Evaluates to true if user selects YES in the AWX dropdown menu
    should_overwrite: "{{ (overwrite_existing | default('NO') | trim | upper) == 'YES' }}"
    
    sample_content: |
      /* SAMPLE FILE CREATED BY ANSIBLE AWX */
      IDENTIFICATION DIVISION.
      PROGRAM-ID. HELLO.
      PROCEDURE DIVISION.
          DISPLAY 'HELLO MAINFRAME'.
          GOBACK.

  tasks:
    - name: Ensure survey variables are provided
      ansible.builtin.fail:
        msg: "Missing required inputs. Please ensure the AWX Survey is populated and enabled."
      when: dsname is undefined or dsorg is undefined

    - name: Validate dataset name syntax
      ansible.builtin.fail:
        msg: "Invalid dataset name syntax. Segments must be 1-8 chars and total length <= 44."
      when: >
        not (clean_dsname | regex_search('^[A-Z@#$][A-Z0-9@#$-]{0,7}(\\.[A-Z@#$][A-Z0-9@#$-]{0,7})*$')) 
        or (clean_dsname | length > 44) or (clean_dsname | length == 0)

    - name: Check if dataset exists on system catalog
      ibm.ibm_zos_core.zos_stat:
        name: "{{ clean_dsname }}"
      register: ds_check

    - name: Check if PDS member already exists
      ibm.ibm_zos_core.zos_stat:
        name: "{{ clean_dsname }}({{ clean_member }})"
      register: member_check
      when: 
        - ds_check.stat.exists
        - clean_dsorg == 'PDS'

    # CONDITIONAL STEP A: Delete the dataset ONLY if it is a SEQ file OR if you explicitly want to wipe the whole PDS
    - name: Delete existing dataset structure if overwrite is YES
      ibm.ibm_zos_core.zos_data_set:
        name: "{{ clean_dsname }}"
        state: absent
      when: 
        - ds_check.stat.exists
        - should_overwrite

    # CONDITIONAL STEP B: Fail ONLY if a Sequential dataset exists OR if the specific PDS member already exists
    - name: Fail if resource conflict exists and overwrite is NO
      ansible.builtin.fail:
        msg: "The requested resource (Dataset or specific Member) already exists! Change overwrite to YES to replace it."
      when:
        - ds_check.stat.exists
        - not should_overwrite
        - (clean_dsorg == 'SEQ') or (clean_dsorg == 'PDS' and member_check.stat.exists | default(false))

    # FIXED: Only allocate if the dataset does NOT exist yet. If a PDS already exists, this skips safely.
    - name: Allocate the SEQ or PDS dataset
      ibm.ibm_zos_core.zos_data_set:
        name: "{{ clean_dsname }}"
        type: "{{ clean_dsorg | lower }}"
        state: present
        space_type: trk
        space_primary: 10
        space_secondary: 2
        record_format: fb
        record_length: 80
        directory_blocks: "{{ 5 if clean_dsorg == 'PDS' else omit }}"
      when: not ds_check.stat.exists or should_overwrite

    - name: Populate Sequential dataset content
      ibm.ibm_zos_core.zos_copy:
        content: "{{ sample_content }}"
        dest: "{{ clean_dsname }}"
        force: true
      when: clean_dsorg == 'SEQ'

    # FIXED: This will now run perfectly if the PDS exists but the member is brand new!
    - name: Create and populate member inside PDS dataset
      ibm.ibm_zos_core.zos_copy:
        content: "{{ sample_content }}"
        dest: "{{ clean_dsname }}({{ clean_member }})"
        force: true
      when: clean_dsorg == 'PDS'

    - name: Output allocation success confirmation
      ansible.builtin.debug:
        msg: "Successfully created and populated {{ clean_dsorg }} dataset: {{ clean_dsname }}"

    - name: Verify dataset attributes via zos_tso_command
      ibm.ibm_zos_core.zos_tso_command:
        commands:
          - "LISTDS '{{ clean_dsname }}'"
      register: tso_cmd_result

    - name: Display TSO LISTDS confirmation from mainframe
      ansible.builtin.debug:
        msg: "{{ tso_cmd_result.output.content | default(tso_cmd_result.output.command_response) | default(tso_cmd_result.output) }}"
